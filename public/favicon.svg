<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Base Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#grad)" />
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="2" />
  
  <!-- Dot '.' -->
  <circle cx="20" cy="41" r="5" fill="#ffffff" filter="url(#shadow)" />
  
  <!-- Asterisk '*' -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" filter="url(#shadow)">
    <line x1="43" y1="21" x2="43" y2="43" />
    <line x1="33.5" y1="26.5" x2="52.5" y2="37.5" />
    <line x1="33.5" y1="37.5" x2="52.5" y2="26.5" />
  </g>
</svg>
